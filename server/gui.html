<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gizmatron Control Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
  .header { background: #16213e; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0f3460; }
  .header h1 { font-size: 1.4em; color: #e94560; }
  .conn-status { display: flex; align-items: center; gap: 8px; font-size: 0.9em; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; }
  .dot.ok { background: #4ecca3; }
  .dot.err { background: #e94560; }
  .main { display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  .panel { background: #16213e; border-radius: 8px; padding: 16px; border: 1px solid #0f3460; height: 100%; }
  .panel h2 { font-size: 1em; color: #4ecca3; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .video-wrap { background: #000; border-radius: 4px; overflow: hidden; position: relative; aspect-ratio: 4/3; }
  .video-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .no-signal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #555; font-size: 1.2em; }
  .device-card { background: #1a1a2e; border-radius: 4px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .device-card .name { font-weight: 600; font-size: 0.9em; }
  .device-card .badge { font-size: 0.75em; padding: 2px 8px; border-radius: 10px; }
  .badge.op { background: #1b4332; color: #4ecca3; }
  .badge.nop { background: #3d0000; color: #e94560; }
  .badge.run { background: #1b3a4b; color: #48cae4; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85em; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; }
  .btn-green { background: #4ecca3; color: #1a1a2e; }
  .btn-red { background: #e94560; color: #fff; }
  .btn-blue { background: #48cae4; color: #1a1a2e; }
  .btn-orange { background: #e9a045; color: #1a1a2e; }
  .slider-group { margin-bottom: 10px; }
  .slider-group label { display: flex; justify-content: space-between; font-size: 0.85em; margin-bottom: 4px; }
  .slider-group input[type=range] { width: 100%; accent-color: #4ecca3; }
  .log-area { background: #0d1117; border-radius: 4px; padding: 8px; height: 120px; overflow-y: auto; font-family: monospace; font-size: 0.78em; border: 1px solid #0f3460; }
  .chat-area { background: #0d1117; border-radius: 4px; padding: 8px; height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 0.85em; border: 1px solid #0f3460; }
  .chat-msg { padding: 6px 10px; border-radius: 6px; max-width: 90%; line-height: 1.4; }
  .chat-msg.user { background: #0f3460; align-self: flex-end; color: #fff; }
  .chat-msg.brain { background: #16213e; align-self: flex-start; border: 1px solid #4ecca3; color: #e0e0e0; }
  .chat-input-wrap { display: flex; gap: 6px; margin-top: 8px; }
  .chat-input { flex: 1; background: #1a1a2e; border: 1px solid #0f3460; color: #fff; padding: 10px 12px; border-radius: 4px; outline: none; font-size: 0.85em; }
</style>
</head>
<body>
<div class="header">
  <h1>Gizmatron Control Panel</h1>
  <div class="conn-status">
    <span id="connLabel">Connecting...</span>
    <span class="dot" id="connDot"></span>
  </div>
</div>

<div class="main">
  <!-- Left: Feed & Brain -->
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div class="panel">
      <h2>Camera Feed</h2>
      <div class="video-wrap">
        <div class="no-signal" id="noSignal">No Signal</div>
        <img id="videoFeed" src="/api/v1/stream" style="display:none" alt="Video Feed">
      </div>
    </div>
    <div class="panel">
      <h2>Brain Interface</h2>
      <div class="chat-area" id="chatArea"></div>
      <div class="chat-input-wrap">
        <input type="text" class="chat-input" id="chatInput" placeholder="Ask the brain to move the robot or search knowledge...">
        <button class="btn btn-green" id="btnSendChat" style="padding: 10px 16px;">Send</button>
      </div>
    </div>
  </div>

  <!-- Right: Status & Controls -->
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div class="panel">
      <h2>Robot Status</h2>
      <div class="device-card">
        <span class="name" id="botName">Gizmatron</span>
        <div>
          <span class="badge nop" id="botOpBadge">Offline</span>
          <span class="badge nop" id="botRunBadge">Stopped</span>
        </div>
      </div>
      <div id="deviceList"></div>
    </div>

    <div class="panel">
      <h2>Controls</h2>
      <div class="controls">
        <button class="btn btn-green" id="btnStartBot">Start Bot</button>
        <button class="btn btn-red" id="btnStopBot">Stop Bot</button>
        <button class="btn btn-blue" id="btnStartCam">Start Cam</button>
        <button class="btn btn-orange" id="btnStopCam">Stop Cam</button>
      </div>
    </div>

    <div class="panel">
      <h2>Arm Control</h2>
      <div class="slider-group"><label><span>X</span><span id="xVal">5.0</span></label><input type="range" id="sliderX" min="-20" max="20" step="0.5" value="5"></div>
      <div class="slider-group"><label><span>Y</span><span id="yVal">5.0</span></label><input type="range" id="sliderY" min="-20" max="20" step="0.5" value="5"></div>
      <div class="slider-group"><label><span>Z</span><span id="zVal">10.0</span></label><input type="range" id="sliderZ" min="0" max="30" step="0.5" value="10"></div>
      <div class="slider-group"><label><span>Speed</span><span id="speedVal">20</span></label><input type="range" id="sliderSpeed" min="5" max="100" step="1" value="20"></div>
      <button class="btn btn-blue" id="btnMoveArm" style="width:100%">Move Arm</button>
    </div>

    <div class="panel">
      <h2>Event Log</h2>
      <div class="log-area" id="logArea"></div>
    </div>
  </div>
</div>

<script>
(function() {
  const logArea = document.getElementById('logArea');
  const chatArea = document.getElementById('chatArea');
  const chatInput = document.getElementById('chatInput');
  let sessionId = null;

  function addLog(msg, isErr) { 
    const ts = new Date().toLocaleTimeString();
    const div = document.createElement('div');
    div.className = 'entry' + (isErr ? ' err' : '');
    div.innerHTML = '<span style="color:#4ecca3">[' + ts + ']</span> ' + msg;
    logArea.appendChild(div); logArea.scrollTop = logArea.scrollHeight;
  }

  function addChat(text, isUser) {
    const div = document.createElement('div');
    div.className = 'chat-msg ' + (isUser ? 'user' : 'brain');
    div.textContent = text; chatArea.appendChild(div); chatArea.scrollTop = chatArea.scrollHeight;
  }

  async function brainReq(method, params) {
    const headers = { 'Content-Type': 'application/json', 'mcp-protocol-version': '2024-11-05' };
    if (sessionId) headers['mcp-session-id'] = sessionId;
    const res = await fetch('/api/v1/brain/mcp', {
      method: 'POST', headers,
      body: JSON.stringify({ jsonrpc: '2.0', id: Date.now(), method, params })
    });
    const sid = res.headers.get('mcp-session-id');
    if (sid) sessionId = sid;
    return res.json();
  }

  async function apiCall(path, method, body) {
    const opts = { method: method || 'POST' };
    if (body) { opts.headers = {'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
    return fetch('/api/v1/robot/' + path, opts).then(r => r.json()).then(data => {
      addLog(path + ': ' + (data.status || 'ok')); return data;
    }).catch(err => { addLog(path + ': ' + err.message, true); });
  }

  function pollStatus() {
    fetch('/api/v1/robot/bot-status').then(r => r.json()).then(data => {
      if (data.botname) document.getElementById('botName').textContent = data.botname;
      
      const opBadge = document.getElementById('botOpBadge');
      const isOp = data.status && data.status.includes('Operational: true');
      opBadge.textContent = isOp ? 'Operational' : 'Not Operational';
      opBadge.className = 'badge ' + (isOp ? 'op' : 'nop');

      const runBadge = document.getElementById('botRunBadge');
      const isRun = data.status && data.status.includes('Running: true');
      runBadge.textContent = isRun ? 'Running' : 'Stopped';
      runBadge.className = 'badge ' + (isRun ? 'run' : 'nop');

      // Devices
      const dl = document.getElementById('deviceList');
      dl.innerHTML = '';
      if (data.device_status) {
        Object.entries(data.device_status).forEach(([key, dev]) => {
          const card = document.createElement('div');
          card.className = 'device-card';
          const opClass = dev.IsOperational ? 'op' : 'nop';
          card.innerHTML = `<span class="name">${dev.Name || key}</span><span class="badge ${opClass}">${dev.Status}</span>`;
          dl.appendChild(card);
        });
      }
    }).catch(e => { addLog('Poll failed: ' + e.message, true); });
  }
  setInterval(pollStatus, 2000);

  // Control buttons
  document.getElementById('btnStartBot').onclick = () => apiCall('bot-start');
  document.getElementById('btnStopBot').onclick = () => apiCall('bot-stop');
  document.getElementById('btnStartCam').onclick = () => apiCall('start/stream');
  document.getElementById('btnStopCam').onclick = () => apiCall('stop/stream');

  // Sliders
  ['X','Y','Z'].forEach(axis => {
    const sl = document.getElementById('slider' + axis);
    sl.oninput = () => { document.getElementById(axis.toLowerCase() + 'Val').textContent = sl.value; };
  });
  document.getElementById('sliderSpeed').oninput = function() {
    document.getElementById('speedVal').textContent = this.value;
  };

  // Move arm
  document.getElementById('btnMoveArm').onclick = () => {
    apiCall('bot-move', 'POST', {
      x: parseFloat(document.getElementById('sliderX').value),
      y: parseFloat(document.getElementById('sliderY').value),
      z: parseFloat(document.getElementById('sliderZ').value),
      speed: parseInt(document.getElementById('sliderSpeed').value)
    });
  };

  async function handleChat() {
    const text = chatInput.value.trim(); if (!text) return;
    addChat(text, true); chatInput.value = '';
    try {
      const res = await brainReq('tools/call', { name: 'search_notes', arguments: { query: text, limit: 1 } });
      const reply = res.result ? JSON.parse(res.result.content[0].text).notes[0] : 'No response.';
      addChat(reply || 'I don\'t know about that yet.', false);
    } catch (e) { addChat('Error: ' + e.message, false); }
  }
  document.getElementById('btnSendChat').onclick = handleChat;
  chatInput.onkeypress = (e) => { if (e.key === 'Enter') handleChat(); };

  // Init
  fetch('/api/v1/robot/ping').then(r => { 
    if(r.ok) { 
      document.getElementById('connDot').className='dot ok'; 
      document.getElementById('connLabel').textContent='Connected'; 
    } 
  });
  
  async function initBrain() {
    try {
      const res = await brainReq('initialize', {
        protocolVersion: '2024-11-05',
        clientInfo: { name: 'gizmo-gui', version: '1.0.0' },
        capabilities: {}
      });
      if (res.result) {
        await brainReq('notifications/initialized', {});
        addChat('Brain online.', false);
      }
    } catch (e) { addLog('Brain sync failed', true); }
  }
  initBrain();
  addLog('GUI loaded.');
})();
</script>
</body>
</html>
